[package]
name = "capriccio"
version = "0.1.0"
authors = ["Jake Van Alstyne ☥ <j@jva.lol>"]
edition = "2018"
rust-version = "1.87"
license = "MIT OR Apache-2.0"

[dependencies]
blitzkit = "0.16"
glam = "0.33"

# The arcade only works inside the project checkout anyway, since it runs the
# games' own binaries, so a path here is not the exception it would be in a game.
blitzkit-shapes = { path = "../blitzkit/shapes" }

# What spec 0130's clock reads to know what time it is where you are.
#
# **The first dependency this game has outside the engine and its shapes**,
# and it is here because the standard library has no time zone. A machine's
# clock is UTC through `std::time` and through the engine's `web_time`
# alike, and the room wants the hour on the player's own wall. Default
# features off: `clock` is the native half and `wasmbind` is the browser's,
# where it reads the same `Date` the page would.
chrono = { version = "0.4", default-features = false, features = ["clock", "wasmbind"] }

# Everything the arcade depends on is optimised even in a debug build, and the
# arcade itself is not.
#
# The room is a physics toy on top of an engine, and debug Rust is roughly
# seventy times slower in a tight numeric loop. The cradle alone runs 240 steps
# a second at 48 solver passes each, which came to 25 to 33 ms a frame: a debug
# `cargo run` drew at 27 and stuttered in the picture and the sound, where the
# release build drew at 120. Worse, it feeds on itself, because a frame that
# takes longer owes more substeps than the frame before it.
#
# This leaves the arcade's own code unoptimised, so it still stops where you ask
# it to and still panics on an overflow rather than wrapping quietly. The cellar
# was caught that way the same afternoon.
[profile.dev.package."*"]
opt-level = 3

# What the room pictures need to wait on a device with no window. Spec 0027:
# the engine's own `pollster` is not this crate's to borrow.
[dev-dependencies]
pollster = "1"

# What build.rs needs to shrink the games' screenshots for a browser build.
# See build.rs: they go inside the binary there, and a cabinet screen is a few
# hundred pixels across however big the picture on it was.
[build-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
